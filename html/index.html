<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FD_DigitDazzle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div id="device" class="device">
            <header class="device-header">
                <span class="device-title">SECURITY BYPASS // DIGIT DAZZLE</span>
                <span id="round-label" class="round-label"></span>
            </header>

            <div class="target-label">LOCATE SEQUENCE</div>
            <div id="target" class="target-strip"></div>

            <div class="timer">
                <div id="timer-fill" class="timer-fill"></div>
            </div>

            <div id="grid" class="grid"></div>

            <footer class="device-footer">
                <span id="status" class="status"></span>
                <span class="hint">ARROWS / WASD MOVE · ENTER CONFIRM · ESC ABORT</span>
            </footer>
        </div>
    </div>

    <script src="logic.js"></script>
    <script src="game.js"></script>
</body>
</html>
